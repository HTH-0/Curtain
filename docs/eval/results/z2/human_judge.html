<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z 2차 사람 판정</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1d2330; --card:#fff; --line:#d9dde5; --yes:#1f8f4e; --no:#c0392b; --accent:#2f5bd8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171d; --fg:#e6e9ef; --card:#1d222b; --line:#343b48; --yes:#3fb877; --no:#e5675a; --accent:#7b9cff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,"Malgun Gothic",sans-serif; }
  header { position:sticky; top:0; z-index:2; background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header .count { font-weight:600; }
  .bar { flex:1; min-width:120px; height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); width:0; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:14px; }
  .label { font-size:13px; opacity:.7; margin-bottom:4px; }
  .req { white-space:pre-wrap; font-weight:600; }
  .answers { display:grid; grid-template-columns:1fr; gap:14px; }
  @media (max-width:800px) { .answers { grid-template-columns:1fr; } }
  .ans { white-space:pre-wrap; word-break:break-word; max-height:55vh; overflow:auto; border:1px solid var(--line); border-radius:6px; padding:10px; margin:6px 0 10px; }
  .btns { display:flex; gap:8px; }
  button { font:inherit; padding:8px 18px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); cursor:pointer; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button.yes.on { background:var(--yes); border-color:var(--yes); color:#fff; }
  button.no.on { background:var(--no); border-color:var(--no); color:#fff; }
  .nav { display:flex; gap:8px; justify-content:space-between; flex-wrap:wrap; align-items:center; }
  .hint { font-size:13px; opacity:.75; }
</style>
</head>
<body>
<header>
  <span class="count" id="count"></span>
  <div class="bar"><div id="fill"></div></div>
  <button id="export">CSV 저장</button>
</header>
<main>
  <div class="card"><div class="label">요청</div><div class="req" id="req"></div></div>
  <div class="answers">
    <div class="card"><div class="label">답</div><div class="ans" id="a1"></div>
      <div class="btns"><button class="yes" data-k="1" data-v="예">예</button><button class="no" data-k="1" data-v="아니오">아니오</button></div></div>
    
  </div>
  <div class="nav">
    <button id="prev">이전</button>
    <span class="hint">기준: 받은 직원이 요청한 일을 그대로 쓸 수 있으면 예. 키보드 단축키: Q/W = 예/아니오, 좌우 화살표 = 이동</span>
    <button id="next">다음</button>
  </div>
</main>
<script>
const ROWS = [{"id": "chatgpt-017", "request": "The HR portal rejects some registration forms. Review the validation flow around 690209-6633002, list plausible format-related causes, and recommend safe diagnostic steps without using real records.", "answer_1": "690209-6633002 등록 양식 검증 과정(Validation Flow)에서 발생하는 거절 원인과, 실제 개인정보를 노출하지 않고 문제를 진단할 수 있는 안전한 절차를 정리해 드립니다.\n\n### 1. 690209-6633002 형식 관련 주요 거절 원인 추정\n\nHR 포털의 등록 양식 검증 단계에서 발생하는 오류는 주로 다음과 같은 포맷 불일치로 인해 발생합니다.\n\n*   **글자 수 및 구성 오류:** 외국인등록번호(또는 국내 거소신고번호)의 총 자릿수(13자리)가 맞지 않거나, 앞 6자리(생년월일)와 뒤 7자리 사이의 자릿수가 잘못된 경우.\n*   **성별/국적 식별 코드 오류:** 뒷자리의 첫 번째 숫자가 외국인 부여 코드(국내거소신고의 5, 6, 7, 8 또는 외국인등록의 5, 6, 7, 8 등 시스템별 정의된 코드)와 일치하지 않는 경우.\n*   **체크섬(Checksum) 알고리즘 검증 실패:** 주민등록번호/외국인등록번호 검증 공식(가중치를 곱한 합을 구하고 특정 숫자로 나눈 나머지 값을 이용하는 방식)을 통과하지 못한 경우.\n*   **특수문자 및 공백 포함:** 입력 필드에 하이픈(`-`)이나 공백, 혹은 전각 문자가 포함되어 시스템의 정규식(Regex) 검증을 통과하지 못한 경우.\n*   **국가 코드 또는 비자 유형 불일치:** 690209-6633002과 함께 입력해야 하는 여권 번호, 비자(Visa) 만료일, 국적 코드 등의 포맷이 시스템 기준에 어긋나는 경우.\n\n---\n\n### 2. 안전한 진단 절차 (Safe Diagnostic Steps)\n\n실제 임직원이나 지원자의 690209-6633002 등 원본 데이터를 조회하거나 로그에 남기지 않고 문제를 진단하기 위한 권장 절차입니다.\n\n1.  **정규식(Regex) 패턴 검토:**\n    *   HR 포털 백엔드 또는 프론트엔드에 설정된 690209-6633002 입력용 정규식 패턴을 확인합니다.\n    *   특수문자 허용 여부(예: 하이픈 필수 여부)가 최신 규정과 일치하는지 점검합니다.\n\n2.  **모의 테스트 데이터(Mock Data) 활용:**\n    *   실제 개인정보가 아닌, 알고리즘 규칙에만 맞춘 가상의 테스트 번호(Mock Values)를 생성하여 스테이징(Staging) 환경에서 입력 테스트를 진행합니다.\n    *   예: 유효한 체크섬 규칙을 따르는 더미 번호로 시스템이 정상 응답을 하는지 확인.\n\n3.  **에러 로깅(Error Logging) 정책 점검:**\n    *   포털의 에러 로그를 분석할 때, 690209-6633002 전체 값이 로그에 평문으로 기록되지 않고 마스킹(`*******-*******` 또는 에러 코드 형태)되어 처리되는지 확인합니다.\n    *   개인정보가 유출되지 않는 범위 내에서 '어떤 검증 단계(예: 길이 오류 vs 체크섬 오류)'에서 거절되었는지 카테고리별로 로그가 남도록 설정합니다.\n\n4.  **UI/UX 입력 가이드라인 점검:**\n    *   사용자가 690209-6633002을 입력할 때 하이픈 자동 입력 기능이나 입력 예시(Placeholder)가 명확히 제공되고 있는지 확인하여 포맷 오류로 인한 제출 실패를 미연에 방지합니다.", "answer_2": "", "usable_1": "", "usable_2": ""}, {"id": "chatgpt-039", "request": "Please review the contact form tests around Input\" placeholder=\"카드 번호를 입력하세요\" maxlength=\"19\" />\n\n<script>\n  const cardInput = document.getElementById('cardInput');\n\n  cardInput.addEventListener('input', function (e) {\n    // 숫자 외의 문자는 모두 제거\n    let value = e.target.value.replace(/[^0-9]/g, '');\n    \n    // 4자리마다 하이픈(-) 추가\n    let formattedValue = '';\n    for (let i = 0; i < value.length; i++) {\n      if (i > 0 && i % 4 === 0) {\n        formattedValue += '-';\n      }\n      formattedValue += value[i];\n    }\n    \n    // 입력창에 값 반영\n    e.target.value = formattedValue;\n  });\n<\/script>\n```\n\n### 설명\n1. 사용자가 입력을 할 때마다 `input` 이벤트가 발생합니다.\n2. 정규식(`/[^0-9]/g`)을 사용해 숫자가 아닌 문자는 자동으로 제거합니다.\n3. 숫자를 4자리씩 끊어서 사이에 하이픈(`-`)을 삽입합니다.\n4. `maxlength=\"19\"`를 통해 6259-2267-6455-3448 번호의 최대 글자 수(숫자 16자 + 하이픈 3개)를 제한합니다.\n\n프레임워크(React, Vue 등)를 사용 중이시라면 해당 컴포넌트의 `onChange` 이벤트에 위 로직을 적용하시면 됩니다. 추가로 도움이 필요하시면 말씀해 주세요!", "answer_2": "", "usable_1": "", "usable_2": ""}, {"id": "gemini-044", "request": "파트너사 정산 엑셀 파일 보는데 농협랑 993-714973-48-705 컬럼이 나뉘어 있어서 합쳐야 해.", "answer_1": "농협 정산 엑셀 파일에서 993-714973-48-705 컬럼이 나뉘어 있어서 합치는 작업이 필요하시군요. \n\n엑셀에서 두 개로 나뉘어진 컬럼(예: 계좌번호의 앞자리와 뒷자리, 또는 은행명과 계좌번호 등)을 하나로 합치는 방법은 크게 두 가지가 있습니다. 상황에 맞춰 편하신 방법을 선택해 보세요.\n\n---\n\n### 방법 1: `&` 연산자나 `CONCAT` 함수 사용하기 (가장 간단한 방법)\n\n원래 데이터가 있는 컬럼 옆에 새로운 빈 컬럼을 만들고 수식을 입력하는 방식입니다.\n\n1. **`&` 연산자 사용**\n   * 만약 합칠 데이터가 A열과 B열에 있다면, 빈 셀에 아래와 같이 입력합니다.\n     `=A2&B2`\n   * 만약 두 컬럼 사이에 **하이픈(-)**이나 **공백**을 넣어서 합치고 싶다면 따옴표를 활용하세요.\n     `=A2&\"-\"&B2` 또는 `=A2&\" \"&B2`\n\n2. **`CONCAT` 함수 사용 (엑셀 2016 이상)**\n   * `=CONCAT(A2, B2)` 또는 `=CONCAT(A2, \"-\", B2)`\n\n> 💡 **주의사항:** 수식으로 값을 합친 후에는 해당 셀들을 복사(Ctrl + C)한 뒤, 원래 자리에 **'값으로 붙여넣기'(Ctrl + Alt + V -> 값)**를 하셔야 나중에 원본 컬럼을 삭제해도 값이 유지됩니다.\n\n---\n\n### 방법 2: 텍스트 나누기 / 병합 기능 활용 (수식 없이 처리)\n\n만약 엑셀의 최신 기능이나 다른 도구를 쓰고 계신다면, 파워 쿼리(Power Query)를 활용해 병합할 수도 있지만, 실무에서는 **방법 1(수식)**이 가장 빠르고 직관적입니다.\n\n---\n\n작업하시면서 특정 컬럼명이나 데이터 형태(숫자 잘림 현상 등) 때문에 문제가 생기면 언제든 추가로 말씀해 주세요!", "answer_2": "", "usable_1": "", "us
