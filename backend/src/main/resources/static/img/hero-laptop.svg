<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="노트북 화면에서 전화번호가 가명으로 바뀌어 외부 AI로 보내지는 포털 화면">
<!-- 임시 이미지(직접 제작). 사진이나 다른 이미지로 바꿀 때는 이 파일만 교체한다 -->
<defs>
  <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity=".12"/>
  </linearGradient>
  <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2dd4a7"/><stop offset="1" stop-color="#1b8f74"/>
  </linearGradient>
  <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#39434f"/><stop offset="1" stop-color="#1c232b"/>
  </linearGradient>
</defs>
<g font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="80" y="14" width="640" height="386" rx="24" fill="#1a212a" stroke="#3a4552" stroke-width="2"/>
  <rect x="98" y="32" width="604" height="350" rx="10" fill="#0d1319"/>
  <circle cx="118" cy="50" r="4" fill="#ff6b61"/><circle cx="134" cy="50" r="4" fill="#ffc24b"/><circle cx="150" cy="50" r="4" fill="#3ddc84"/>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#7d8b99">HTH 사내 AI 포털</text>
  <line x1="98" y1="66" x2="702" y2="66" stroke="#1f2a35"/>

  <rect x="372" y="82" width="312" height="48" rx="12" fill="#1e3a33"/>
  <text x="388" y="103" font-size="13" fill="#d9f2e9">고객 010-2345-6789 에게</text>
  <text x="388" y="121" font-size="13" fill="#d9f2e9">안내 메일 초안을 써 줘</text>

  <rect x="118" y="146" width="402" height="44" rx="8" fill="#12263a"/>
  <rect x="118" y="146" width="3" height="44" fill="#6aa8e6"/>
  <text x="134" y="165" font-size="13" font-weight="700" fill="#8db7e3">가려서 보냈습니다.</text>
  <text x="134" y="182" font-size="12" fill="#a9bccd">휴대전화 1건 · 외부 AI로 간 문장: 고객 [전화1] 에게 …</text>

  <rect x="118" y="204" width="420" height="58" rx="10" fill="#18212a" stroke="#27333f"/>
  <text x="134" y="226" font-size="13" fill="#d4dde5">안녕하세요, 010-2345-6789 고객님.</text>
  <text x="134" y="246" font-size="13" fill="#d4dde5">문의하신 내용을 안내드립니다 …</text>

  <g transform="translate(560 196)">
    <path d="M60 0 L112 18 V62 C112 98 90 124 60 138 C30 124 8 98 8 62 V18 Z" fill="url(#shield)" opacity=".95"/>
    <path d="M60 10 L102 24 V62 C102 92 84 114 60 127 C36 114 18 92 18 62 V24 Z" fill="none" stroke="#0d1319" stroke-opacity=".35" stroke-width="2"/>
    <rect x="42" y="58" width="36" height="28" rx="5" fill="#0d1319"/>
    <path d="M49 58 V50 a11 11 0 0 1 22 0 V58" fill="none" stroke="#0d1319" stroke-width="5"/>
    <circle cx="60" cy="71" r="4" fill="#2dd4a7"/>
  </g>

  <text x="400" y="368" text-anchor="middle" font-size="92" font-weight="800" letter-spacing="2" fill="url(#title)" textLength="560" lengthAdjust="spacingAndGlyphs">DESKGUARD</text>

  <path d="M30 400 H770 L752 426 H48 Z" fill="url(#base)"/>
  <rect x="340" y="400" width="120" height="8" rx="4" fill="#0d1319"/>
</g>
</svg>
