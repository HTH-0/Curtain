<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="직원이 입력한 전화번호가 게이트웨이에서 [전화1]로 바뀌어 외부 AI로 가고, 답에서 원래 값으로 되돌아오는 흐름">
<!-- 임시 이미지(직접 제작). 교체할 때는 이 파일만 바꾼다 -->
<g font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="10" y="50" width="230" height="110" rx="14" fill="#ffffff" stroke="#c9d3cd" stroke-width="2"/>
  <text x="125" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#23634f">직원</text>
  <text x="125" y="108" text-anchor="middle" font-size="14" fill="#1f2622">"010-2345-6789 로</text>
  <text x="125" y="130" text-anchor="middle" font-size="14" fill="#1f2622">메일을 써 줘"</text>

  <rect x="335" y="30" width="230" height="150" rx="14" fill="#0f1a17"/>
  <path d="M450 44 L500 60 V98 C500 128 482 150 450 164 C418 150 400 128 400 98 V60 Z" fill="#2dd4a7"/>
  <rect x="436" y="92" width="28" height="22" rx="4" fill="#0f1a17"/>
  <path d="M441 92 V86 a9 9 0 0 1 18 0 V92" fill="none" stroke="#0f1a17" stroke-width="4"/>
  <text x="450" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#23634f">게이트웨이가 검사하고 가림</text>

  <rect x="660" y="50" width="230" height="110" rx="14" fill="#ffffff" stroke="#c9d3cd" stroke-width="2"/>
  <text x="775" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#2f5d8a">외부 AI</text>
  <text x="775" y="108" text-anchor="middle" font-size="14" fill="#1f2622">"[전화1] 로</text>
  <text x="775" y="130" text-anchor="middle" font-size="14" fill="#1f2622">메일을 써 줘"</text>

  <path d="M244 105 H330" stroke="#23634f" stroke-width="3" fill="none"/><path d="M322 97 L334 105 L322 113 Z" fill="#23634f"/>
  <path d="M570 105 H656" stroke="#2f5d8a" stroke-width="3" fill="none"/><path d="M648 97 L660 105 L648 113 Z" fill="#2f5d8a"/>
  <text x="287" y="92" text-anchor="middle" font-size="12" fill="#5f6b65">원문</text>
  <text x="613" y="92" text-anchor="middle" font-size="12" fill="#5f6b65">가린 문장</text>

  <path d="M775 166 V232 H125 V168" stroke="#8a6a12" stroke-width="2.5" stroke-dasharray="7 6" fill="none"/>
  <path d="M117 176 L125 164 L133 176 Z" fill="#8a6a12"/>
  <text x="450" y="252" text-anchor="middle" font-size="13" fill="#8a6a12">답이 돌아오면 [전화1]을 원래 값으로 되돌려 직원에게 보여 줌</text>
</g>
</svg>
