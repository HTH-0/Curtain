<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
<!-- 요청 경로 지도: 직원 PC(서울) → 게이트웨이 검사(조준선) → 외부 AI. 대륙은 점으로 대강 그린 장식이다. 직접 그린 그림 -->
<defs>
<pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="2" fill="#4a4a4a"/></pattern>
<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0 H0 V50" fill="none" stroke="#1d1d1d" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="480" fill="#0f0f0f"/>
<rect width="1000" height="480" fill="url(#grid)"/>
<g fill="url(#dots)">
  <path d="M90 110 L210 70 L330 80 L360 130 L300 190 L260 230 L230 260 L200 220 L150 200 L110 160 Z"/>
  <path d="M260 270 L320 280 L340 330 L310 410 L280 440 L270 380 L250 320 Z"/>
  <path d="M450 90 L540 70 L580 100 L560 140 L500 150 L460 130 Z"/>
  <path d="M470 170 L570 160 L610 220 L590 300 L550 370 L520 360 L500 280 L460 230 Z"/>
  <path d="M580 80 L760 60 L900 90 L930 140 L860 190 L820 230 L760 220 L700 200 L640 170 L600 140 Z"/>
  <path d="M800 320 L880 310 L910 350 L870 390 L810 380 Z"/>
</g>
<!-- 경로: 원문은 게이트웨이까지만(회색 점선), 가린 문장만 외부로(초록) -->
<path d="M845 165 Q700 150 556 232" fill="none" stroke="#bdbdbd" stroke-width="2.5" stroke-dasharray="8 7"/>
<path d="M524 232 Q380 140 224 158" fill="none" stroke="#6f9a4f" stroke-width="3.5"/>
<!-- 직원 PC -->
<circle cx="845" cy="165" r="30" fill="#1b1b1b" stroke="#e9e9e9" stroke-width="2.5"/>
<rect x="830" y="153" width="30" height="20" rx="3" fill="none" stroke="#e9e9e9" stroke-width="2.5"/>
<path d="M838 180 H852" stroke="#e9e9e9" stroke-width="2.5" stroke-linecap="round"/>
<text x="845" y="222" text-anchor="middle" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="17" fill="#e9e9e9">직원 PC · 원문</text>
<!-- 게이트웨이 조준선 -->
<circle cx="540" cy="240" r="40" fill="none" stroke="#e9e9e9" stroke-width="2.5"/>
<circle cx="540" cy="240" r="18" fill="none" stroke="#e9e9e9" stroke-width="2"/>
<path d="M540 188 V214 M540 266 V292 M488 240 H514 M566 240 H592" stroke="#e9e9e9" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="540" cy="240" r="6" fill="#6f9a4f"/>
<text x="540" y="318" text-anchor="middle" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="17" fill="#e9e9e9">게이트웨이 검사</text>
<text x="540" y="340" text-anchor="middle" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#9a9a9a">가림 · 차단 · 경고 · 허용</text>
<!-- 외부 AI -->
<circle cx="210" cy="160" r="30" fill="#3d5a2c" stroke="#e9e9e9" stroke-width="2.5"/>
<path d="M196 168 Q196 150 210 150 Q224 150 224 168 Z M200 168 H220" fill="none" stroke="#e9e9e9" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="204" cy="160" r="2.5" fill="#e9e9e9"/><circle cx="216" cy="160" r="2.5" fill="#e9e9e9"/>
<text x="210" y="218" text-anchor="middle" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="17" fill="#e9e9e9">외부 AI · 가린 문장만</text>
</svg>
